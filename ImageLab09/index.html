<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box> -->
      <a-sphere position="0 0.5 -5" radius="0.5" color="white"></a-sphere>
      <a-sphere position="0 1.15 -5" radius="0.35" color="white"></a-sphere>
      <a-sphere position="0 1.68 -5" radius="0.28" color="white"></a-sphere>
      <a-cylinder position="0 1.3 -5" rotation="90 90"radius="0.05" height="1.5" color="brown"></a-cylinder>
      <a-cylinder position="0 1.3 -4.75" rotation="90" radius="0.05" height="0.2" color="black"></a-cylinder>
      <a-cylinder position="0 1.1 -4.71" rotation="90" radius="0.05" height="0.2" color="black"></a-cylinder>
      <a-cylinder position="0 0.8 -4.65" rotation="90" radius="0.05" height="0.2" color="black"></a-cylinder>
      <a-cylinder position="0.1 1.75 -4.82" rotation="90" radius="0.05" height="0.2" color="black"></a-cylinder>
      <a-cylinder position="-0.1 1.75 -4.82" rotation="90" radius="0.05" height="0.2" color="black"></a-cylinder>
      <a-cylinder position="0.02 2.2 -5.1" rotation="-10 -10" radius="0.18" height="0.5" color="black"></a-cylinder>
      <a-cylinder position="0 1.9 -5.05" rotation="-10 -10" radius="0.27" height="0.1" color="black"></a-cylinder>
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="white"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: moon; dressingAmount: 4"></a-entity>
    </a-scene>
  </body>
</html>
